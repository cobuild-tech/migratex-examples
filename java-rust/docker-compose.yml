# The Java original, the Rust port and an nginx front, sharing one MySQL.
#
#   docker compose up -d --build
#   Java  http://localhost:8280/
#   Rust  http://localhost:8281/
#   nginx http://localhost:8200/   (nginx.conf picks a side per page)
services:
  db:
    image: mysql:8.0
    # The dump is from MySQL 8.0.13. Connector/J 8.0.22 and sqlx both speak
    # caching_sha2, but native passwords keep the Java side's TLS out of it.
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "1"
      MYSQL_DATABASE: flyaway
      MYSQL_USER: flyaway
      MYSQL_PASSWORD: flyaway
    volumes:
      - ./java/Dump20220514.sql:/docker-entrypoint-initdb.d/flyaway.sql:ro
    ports:
      - "3327:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "--silent"]
      interval: 2s
      retries: 60

  java:
    build:
      context: ./java
      dockerfile: docker/Dockerfile
    ports:
      - "8280:8080"
    depends_on:
      db:
        condition: service_healthy

  rust:
    build:
      context: .
      dockerfile: rust/Dockerfile
    environment:
      DATABASE_URL: mysql://flyaway:flyaway@db:3306/flyaway
      FLYAWAY_COMPAT: ${FLYAWAY_COMPAT:-1}
      FLYAWAY_ADMIN_PASSWORD: ${FLYAWAY_ADMIN_PASSWORD:-change-me}
    ports:
      - "8281:8080"
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8200:80"
    depends_on: [java, rust]
