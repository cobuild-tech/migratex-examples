# The strangler-fig front: each URL is served by exactly one side.
#
# FlyAway keeps its state in static fields, in memory, so pages that share a
# field must move together: a search made on one side is invisible to the
# other. There are three groups, and each moves as a whole:
#
#   pages     no state: the home page, the search form, the two
#             "Coming Soon" pages, images and CSS
#   booking   model.Search and model.Booking: /search through thank-you.jsp
#   admin     servlets.Login: login, dashboard and password change
#
# To move a group, change its `proxy_pass` lines and run `nginx -s reload`.
# Here pages and booking are on Rust; admin is still on Java.

upstream java { server java:8080; }
upstream rust { server rust:8080; }

server {
    listen 80;

    # nginx proxies with HTTP/1.0 by default. Tomcat then answers a GET to a
    # doPost-only servlet with 400 instead of 405, and makes redirects
    # absolute. The Rust side doesn't care, but the Java side must not change.
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;

    # pages: moved
    location = /                   { proxy_pass http://rust; }
    location = /index.jsp          { proxy_pass http://rust; }
    location = /search-portal.jsp  { proxy_pass http://rust; }
    location = /add-flight.jsp     { proxy_pass http://rust; }
    location = /show-bookings.jsp  { proxy_pass http://rust; }
    location /img/                 { proxy_pass http://rust; }
    location /style/               { proxy_pass http://rust; }

    # booking: moved
    location = /search              { proxy_pass http://rust; }
    location = /search-results.jsp  { proxy_pass http://rust; }
    location = /booking-details.jsp { proxy_pass http://rust; }
    location = /payment.jsp         { proxy_pass http://rust; }
    location = /thank-you.jsp       { proxy_pass http://rust; }

    # admin: still on Java
    location = /login.jsp           { proxy_pass http://java; }
    location = /login               { proxy_pass http://java; }
    location = /admin-dashboard.jsp { proxy_pass http://java; }
    location = /change-password.jsp { proxy_pass http://java; }
    location = /change-password     { proxy_pass http://java; }

    location / { proxy_pass http://java; }
}
