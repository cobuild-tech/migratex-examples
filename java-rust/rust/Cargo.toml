[package]
name = "flyaway"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
argon2 = "0.5.3"
askama = "0.12.1"
axum = "0.7.9"
serde = { version = "1.0.215", features = ["derive"] }
sqlx = { version = "0.8.2", default-features = false, features = ["runtime-tokio", "mysql"] }
tokio = { version = "1.41.1", features = ["macros", "rt-multi-thread", "net", "sync"] }
tower-sessions = { version = "0.13.0", default-features = false, features = ["axum-core", "memory-store"] }

[dev-dependencies]
http-body-util = "0.1.2"
tower = { version = "0.5.1", features = ["util"] }
