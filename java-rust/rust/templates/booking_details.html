{% extends "base.html" %}
{% block title %}Booking Details - FlyAway Airlines{% endblock %}
{% block content %}
<section class="container-fluid bg">
    <section class="row justify-content-center">
        <section class="col-sm-6 col-md-3">
            <form action="/payment.jsp" method="post" class="form-container">
                <h1 align="center"><b>Booking Details</b></h1>
                <p align="center"><strong>{{ flight_name }}, Rs.{{ ticket_price }} per person</strong></p>
                {% if let Some(error) = error %}<p class="error">{{ error }}</p>{% endif %}
                <div class="form-group">
                    <label for="pname">Passenger Name</label>
                    <input type="text" class="form-control" id="pname" name="pname" required maxlength="100">
                </div>
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" name="email" class="form-control" id="email" required maxlength="254">
                </div>
                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="tel" class="form-control" id="phone" name="phone" required>
                </div>
                <br>
                <button type="submit" class="btn btn-success btn-block">Submit</button>
            </form>
        </section>
    </section>
</section>
{% endblock %}
