{% extends "base.html" %}
{% block content %}
<section class="container-fluid bg">
    <section class="row justify-content-center">
        <section class="col-sm-6 col-md-3">
            <form action="/search" class="form-container">
                <h2 align="center"><b>FlyAway <br> Ticket Booking</b></h2>
                {% if let Some(error) = error %}<p class="error">{{ error }}</p>{% endif %}
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" class="form-control" id="date" name="date" required>
                </div>
                <div class="form-group">
                    <label for="source">Source</label>
                    <select class="form-control" id="source" name="source">
                        <option value="India">India</option>
                        <option value="USA">USA</option>
                        <option value="UK">UK</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="destination">Destination</label>
                    <select class="form-control" id="destination" name="destination">
                        <option value="USA">USA</option>
                        <option value="UK">UK</option>
                        <option value="India">India</option>
                    </select>
                </div>
                <div>
                    <label for="persons">No of Persons</label>
                    <select class="form-control" id="persons" name="persons">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                    </select>
                </div>
                <br>
                <button type="submit" class="btn btn-success btn-block">Search Flights</button>
            </form>
        </section>
    </section>
</section>
{% endblock %}
