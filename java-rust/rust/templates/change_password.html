{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="container">
    <h1>Password Change</h1>
    {% if changed %}<p>Password changed.</p>{% endif %}
    {% if let Some(error) = error %}<p class="error">{{ error }}</p>{% endif %}
    <form action="/change-password" method="post">
        <div class="form-group mx-sm-3 mb-2">
            <label for="inputPassword" class="sr-only">New Password</label>
            <input type="password" name="passwordEntered" class="form-control" id="inputPassword" placeholder="Enter a new password" required minlength="8">
        </div>
        <button type="submit" class="btn btn-info mb-2">Change Password</button>
    </form>
</div>
{% endblock %}
