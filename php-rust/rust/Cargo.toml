[package]
name = "students"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.7.9"
serde_json = { version = "1.0.133", features = ["preserve_order"] }
sqlx = { version = "0.8.2", default-features = false, features = ["runtime-tokio", "mysql"] }
tokio = { version = "1.41.1", features = ["macros", "rt-multi-thread", "net", "sync"] }

[dev-dependencies]
http-body-util = "0.1.2"
tower = { version = "0.5.1", features = ["util"] }
