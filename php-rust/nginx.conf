# The strangler-fig front: each PHP script is served by exactly one side.
# To move a script, change its `proxy_pass` and run `nginx -s reload`.
# To move it back, change the line back.

upstream php  { server php:80; }
upstream rust { server rust:8080; }

server {
    listen 80;

    location = /api/get.php     { proxy_pass http://rust; }   # moved
    location = /api/get_one.php { proxy_pass http://rust; }   # moved
    location = /api/post.php    { proxy_pass http://php; }
    location = /api/put.php     { proxy_pass http://php; }
    location = /api/delete.php  { proxy_pass http://php; }

    location / { proxy_pass http://php; }
}
